services:
  - type: web
    name: internconnect-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DB_NAME
        value: internconnect_ai
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: AI_API_KEY
        sync: false
      - key: ALLOW_ALL_ORIGINS
        value: "true"
      - key: AUTO_SEED
        value: "true"
